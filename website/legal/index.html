<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORTEX Legal Hub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<style>
:root {
  --saffron: #FF9933;
  --green: #138808;
  --navy: #08081A;
  --glass: rgba(255,255,255,0.04);
  --glass-border: rgba(255,255,255,0.07);
  --text: #E8E8F0;
  --text-dim: rgba(232,232,240,0.35);
  --text-muted: rgba(232,232,240,0.18);
  --red: #FF4466; --yellow: #FFB800; --green-flag: #00E676; --blue: #4488FF;
  --radius: 12px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--navy); color:var(--text); overflow:hidden; }
#three-canvas { position:fixed; inset:0; z-index:0; pointer-events:none; }
#app { position:relative; z-index:1; display:flex; flex-direction:column; height:100vh; opacity:0; transition:opacity 0.6s; }
#app.visible { opacity:1; }

#loader { position:fixed; inset:0; z-index:500; display:flex; align-items:center; justify-content:center; background:rgba(8,8,26,0.9); backdrop-filter:blur(24px); transition:opacity 0.6s; }
#loader.hidden { opacity:0; pointer-events:none; }
.loader-card { text-align:center; animation:pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:0.6} 50%{opacity:1} }
.loader-card .icon { font-size:48px; margin-bottom:12px; }
.loader-card p { color:var(--text-dim); font-size:13px; }

#no-key-overlay { position:fixed; inset:0; z-index:1000; display:none; align-items:center; justify-content:center; background:rgba(8,8,26,0.85); backdrop-filter:blur(32px); }
.no-key-card { background:var(--glass); backdrop-filter:blur(40px); border:1px solid var(--glass-border); border-radius:20px; padding:40px; max-width:460px; width:90%; text-align:center; }
.no-key-card .icon { font-size:48px; margin-bottom:12px; }
.no-key-card h2 { font-size:20px; font-weight:700; margin-bottom:10px; background:linear-gradient(135deg,var(--saffron),var(--green)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.no-key-card p { color:var(--text-dim); font-size:13px; line-height:1.5; margin-bottom:6px; }
.no-key-card code { display:inline-block; padding:6px 14px; margin:10px 0; background:rgba(0,0,0,0.3); border:1px solid var(--glass-border); border-radius:6px; font-family:'SF Mono',monospace; font-size:12px; color:var(--saffron); }
.no-key-card .cmd-btn { display:inline-block; padding:8px 20px; margin-top:12px; background:linear-gradient(135deg,var(--saffron),var(--green)); border:none; border-radius:8px; color:white; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; text-decoration:none; }

header { display:flex; align-items:center; padding:8px 16px; background:rgba(8,8,26,0.5); backdrop-filter:blur(12px); border-bottom:1px solid var(--glass-border); gap:8px; flex-shrink:0; }
header .logo { display:flex; align-items:center; gap:6px; font-size:14px; font-weight:700; }
header .logo-icon { width:24px;height:24px;background:linear-gradient(135deg,var(--saffron),var(--green));border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px; }
header .logo span { background:linear-gradient(135deg,var(--saffron),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent; }
.header-right { margin-left:auto; display:flex; align-items:center; gap:6px; }
.badge { padding:2px 8px; border-radius:4px; font-size:9px; font-weight:600; letter-spacing:0.2px; }
.badge-model { border:1px solid rgba(255,153,51,0.2); background:rgba(255,153,51,0.05); color:var(--saffron); }
.badge-scraper { border:1px solid rgba(68,136,255,0.2); background:rgba(68,136,255,0.05); color:var(--blue); }
.badge-scraper.off { border-color:var(--glass-border); background:var(--glass); color:var(--text-muted); }

.chat-area { flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:8px; }
.chat-area:empty::after { content:'Ask a legal question or paste a contract.'; display:block; text-align:center; color:var(--text-muted); margin-top:80px; font-size:13px; }

.message { max-width:80%; padding:10px 14px; line-height:1.6; font-size:13px; animation:msgIn 0.3s ease; }
@keyframes msgIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.message.user { align-self:flex-end; background:linear-gradient(135deg,rgba(255,153,51,0.06),rgba(19,136,8,0.03)); border-radius:var(--radius) var(--radius) 4px var(--radius); }
.message.assistant { align-self:flex-start; background:rgba(255,255,255,0.02); border-radius:var(--radius) var(--radius) var(--radius) 4px; border-left:2px solid rgba(255,153,51,0.15); padding-left:12px; }
.message.system { align-self:center; color:var(--text-dim); font-size:11px; text-align:center; max-width:70%; }
.message .source-badge { display:inline-block; padding:1px 5px; border-radius:3px; font-size:9px; background:rgba(68,136,255,0.08); color:var(--blue); border:1px solid rgba(68,136,255,0.12); margin:0 1px 1px 0; }

.input-area { padding:8px 16px 10px; border-top:1px solid var(--glass-border); background:rgba(8,8,26,0.3); backdrop-filter:blur(8px); flex-shrink:0; }
.input-row { display:flex; gap:6px; align-items:flex-end; }
.input-wrapper { flex:1; }
.input-wrapper textarea { width:100%; padding:8px 12px; background:rgba(0,0,0,0.12); border:1px solid var(--glass-border); border-radius:8px; color:var(--text); font-size:13px; font-family:inherit; resize:none; min-height:34px; max-height:80px; outline:none; }
.input-wrapper textarea:focus { border-color:rgba(255,153,51,0.2); }
.input-wrapper textarea::placeholder { color:var(--text-muted); }
.attach-btn { padding:4px 6px; background:transparent; border:1px solid var(--glass-border); border-radius:8px; color:var(--text-dim); font-size:13px; cursor:pointer; height:34px; line-height:1; flex-shrink:0; }
.attach-btn:hover { background:var(--glass); color:var(--text); }
.doc-bar { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; min-height:0; }
.doc-tag { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; background:rgba(0,230,118,0.06); border:1px solid rgba(0,230,118,0.15); border-radius:4px; font-size:10px; color:var(--green-flag); }
.doc-tag .remove { cursor:pointer; opacity:0.4; font-size:11px; }
.doc-tag .remove:hover { opacity:1; }

.footer-bar { display:flex; align-items:center; justify-content:flex-end; padding:3px 16px; background:rgba(8,8,26,0.3); border-top:1px solid var(--glass-border); font-size:9px; color:var(--text-muted); flex-shrink:0; }

.tag { display:inline-block; padding:1px 5px; border-radius:3px; font-size:10px; font-weight:700; margin:0 1px 1px 0; }
.tag-green { background:rgba(0,230,118,0.08); color:var(--green-flag); border:1px solid rgba(0,230,118,0.12); }
.tag-yellow { background:rgba(255,184,0,0.08); color:var(--yellow); border:1px solid rgba(255,184,0,0.12); }
.tag-red { background:rgba(255,68,102,0.08); color:var(--red); border:1px solid rgba(255,68,102,0.12); }
.message code { background:rgba(0,0,0,0.15); border:1px solid var(--glass-border); border-radius:4px; padding:3px 6px; margin:2px 0; font-size:12px; font-family:'SF Mono',monospace; white-space:pre-wrap; word-break:break-word; }
.message strong { color:var(--saffron); }
.message p { margin:3px 0; }
.message a { color:var(--saffron); text-decoration:underline; }
::-webkit-scrollbar { width:3px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--glass-border); border-radius:2px; }

@media (max-width:720px) { .message{max-width:92%} .header-right .badge{display:none} }
</style>
</head>
<body>
<div id="three-canvas"></div>

<div id="loader">
  <div class="loader-card">
    <div class="icon">⚖</div>
    <p>Connecting to CORTEX Legal Hub...</p>
  </div>
</div>

<div id="no-key-overlay">
  <div class="no-key-card">
    <div class="icon">🔑</div>
    <h2>OpenRouter Key Required</h2>
    <p>Run <strong>/connect</strong> in your CORTEX terminal, select OpenRouter, and enter your API key (sk-or-v1-...).</p>
    <code>/connect</code>
    <p style="margin-top:10px;font-size:12px;color:var(--text-muted)">Then type <strong>/legal</strong> again.</p>
    <button class="cmd-btn" onclick="navigator.clipboard?.writeText('/connect')">Copy /connect</button>
  </div>
</div>

<div id="app">
  <header>
    <div class="logo"><div class="logo-icon">⚖</div><span>Legal Hub</span></div>
    <div class="header-right">
      <span class="badge badge-model">GPT-OSS-120B</span>
      <span class="badge badge-scraper" id="scraper-badge">Scrapling</span>
    </div>
  </header>

  <div class="chat-area" id="chat-area"></div>

  <div class="input-area">
    <div class="input-row">
      <button class="attach-btn" id="attach-btn" title="Attach document">📎</button>
      <input type="file" id="file-input" accept=".txt,.md,.pdf" style="display:none">
      <div class="input-wrapper">
        <textarea id="msg-input" placeholder="Ask a legal question or paste a contract..." rows="1"></textarea>
      </div>
      <button class="send-btn" id="send-btn">Send</button>
    </div>
    <div class="doc-bar" id="doc-bar"></div>
  </div>

  <div class="footer-bar">
    <span id="port-label"></span>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('three-canvas');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
canvas.appendChild(renderer.domElement);

const center = new THREE.Vector3(0, 0, 0);

const pCount = 400;
const pos = new Float32Array(pCount * 3);
for (let i = 0; i < pCount; i++) {
  pos[i * 3] = (Math.random() - 0.5) * 40;
  pos[i * 3 + 1] = (Math.random() - 0.5) * 30;
  pos[i * 3 + 2] = (Math.random() - 0.5) * 30 - 8;
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const pMat = new THREE.PointsMaterial({ color: '#FF9933', size: 0.025, transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending, depthWrite: false });
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

const dodecGeo = new THREE.DodecahedronGeometry(0.6, 0);
const dodecMat = new THREE.MeshPhysicalMaterial({ color: '#FF9933', transparent: true, opacity: 0.08, metalness: 0.6, roughness: 0.2, emissive: '#FF9933', emissiveIntensity: 0.02 });
const dodec = new THREE.Mesh(dodecGeo, dodecMat);
dodec.position.set(0, 0, -3);
scene.add(dodec);

const edgeGeo = new THREE.EdgesGeometry(dodecGeo);
const edgeMat = new THREE.LineBasicMaterial({ color: '#FF9933', transparent: true, opacity: 0.1 });
dodec.add(new THREE.LineSegments(edgeGeo, edgeMat));

const glow = new THREE.Mesh(new THREE.SphereGeometry(0.9, 16, 16), new THREE.MeshBasicMaterial({ color: '#FF9933', transparent: true, opacity: 0.025, side: THREE.BackSide }));
glow.position.copy(dodec.position);
scene.add(glow);

let mx = 0, my = 0;
document.addEventListener('mousemove', e => { mx = (e.clientX / window.innerWidth - 0.5) * 2; my = (e.clientY / window.innerHeight - 0.5) * 2; });

function animate() {
  requestAnimationFrame(animate);
  const t = Date.now() * 0.001;
  particles.rotation.y += 0.00015;
  dodec.rotation.x += 0.002;
  dodec.rotation.y += 0.003;
  glow.scale.setScalar(1 + Math.sin(t * 0.3) * 0.1);
  camera.position.x += (mx * 0.15 - camera.position.x) * 0.008;
  camera.position.y += (-my * 0.12 - camera.position.y) * 0.008;
  camera.lookAt(center);
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const HAS_KEY = __HAS_KEY__;
const PORT = __PORT__;

let isLoading = false;

const $ = (id) => document.getElementById(id);
const chatArea = $('chat-area');
const msgInput = $('msg-input');
const sendBtn = $('send-btn');
const attachBtn = $('attach-btn');
const fileInput = $('file-input');
const docBar = $('doc-bar');
const loader = $('loader');
const app = $('app');
const noKeyOverlay = $('no-key-overlay');
const portLabel = $('port-label');
const scraperBadge = $('scraper-badge');

portLabel.textContent = `:${PORT}`;
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

async function init() {
  if (!HAS_KEY) { loader.classList.add('hidden'); noKeyOverlay.style.display = 'flex'; return; }
  try {
    const r = await fetch('/api/status'); const d = await r.json();
    d.scraperAvailable ? scraperBadge.classList.remove('off') : scraperBadge.classList.add('off');
  } catch { scraperBadge.classList.add('off'); }
  loader.classList.add('hidden');
  app.classList.add('visible');
  await refreshDocs();
  addMessage('assistant', '<strong>⚖ Legal Hub</strong><br><br>Ask any Indian law question or attach documents (up to 3) for analysis. Documents persist for the session.');
  msgInput.focus();
}

// ── Document management ──
async function refreshDocs() {
  try {
    const r = await fetch('/api/documents'); const d = await r.json();
    if (d.documents?.length) {
      docBar.innerHTML = d.documents.map(doc =>
        `<span class="doc-tag">📄 ${doc.name} <span class="remove" data-doc-id="${doc.id}">✕</span></span>`
      ).join('');
      docBar.querySelectorAll('.remove').forEach(el =>
        el.addEventListener('click', async () => {
          await fetch(`/api/documents/${el.dataset.docId}`, { method: 'DELETE' });
          await refreshDocs();
        })
      );
    } else {
      docBar.innerHTML = '';
    }
  } catch {}
}

attachBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {
  const f = fileInput.files?.[0];
  if (!f) return;
  fileInput.value = '';

  // Check current doc count
  try {
    const chk = await fetch('/api/documents'); const cd = await chk.json();
    if (cd.documents?.length >= 3) { addMessage('system', 'Max 3 documents. Remove one first.'); return; }
  } catch {}

  addMessage('system', `Reading ${f.name}...`);
  try {
    let content = '';
    if (f.name.endsWith('.pdf')) {
      const buf = await f.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      const pages = [];
      for (let i = 1; i <= Math.min(pdf.numPages, 60); i++) {
        const page = await pdf.getPage(i);
        const t = await page.getTextContent();
        pages.push(t.items.map(s => s.str).join(' '));
      }
      content = pages.join('\n\n');
    } else {
      content = await f.text();
    }
    if (content.length > 150000) content = content.slice(0, 150000) + '\n... [truncated]';

    const r = await fetch('/api/documents', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: f.name, content }),
    });
    const d = await r.json();
    removeSysMsg();
    if (d.success) {
      addMessage('system', `📎 ${f.name} uploaded`);
      await refreshDocs();
    } else {
      addMessage('system', `Upload failed: ${d.error}`);
    }
  } catch (e) {
    removeSysMsg();
    addMessage('system', `Error reading ${f.name}: ${e.message}`);
  }
});

// ── Chat ──
function addMessage(role, content, cls) {
  const div = document.createElement('div');
  div.className = `message ${role}${cls ? ' ' + cls : ''}`;
  div.innerHTML = content;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function fmt(text) {
  return text
    .replace(/\[GREEN\]/g, '<span class="tag tag-green">[GREEN]</span>')
    .replace(/\[YELLOW\]/g, '<span class="tag tag-yellow">[YELLOW]</span>')
    .replace(/\[RED\]/g, '<span class="tag tag-red">[RED]</span>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .split(/\n\n+/).map(p => p.trim() ? `<p>${p.replace(/\n/g, '<br>')}</p>` : '').join('');
}

function removeSysMsg() { const last = chatArea.lastElementChild; if (last && last.classList.contains('system')) last.remove(); }

async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text || isLoading) return;
  msgInput.value = ''; msgInput.style.height = 'auto';
  isLoading = true; sendBtn.disabled = true; sendBtn.textContent = 'Thinking...';
  addMessage('user', fmt(text));
  addMessage('system', 'Thinking...');

  try {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: [{ role: 'user', content: text }] }),
    });
    const d = await r.json();
    removeSysMsg();
    if (d._source === 'knowledge') addMessage('system', 'Answered from knowledge');
    if (d.sources?.length) addMessage('system', 'Sources: ' + d.sources.map(s => `<span class="source-badge">${s.title || s.url}</span>`).join(' '));
    if (!r.ok) addMessage('assistant', `Error: ${d.error?.message || JSON.stringify(d.error) || `HTTP ${r.status}`}`);
    else { const c = d.choices?.[0]?.message?.content; addMessage('assistant', c ? fmt(c) : 'No response.'); }
  } catch (e) { removeSysMsg(); addMessage('assistant', `Error: ${e.message}`); }

  isLoading = false; sendBtn.disabled = false; sendBtn.textContent = 'Send';
}

sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
msgInput.addEventListener('input', () => { msgInput.style.height = 'auto'; msgInput.style.height = Math.min(msgInput.scrollHeight, 80) + 'px'; });
init();
</script>
</body>
</html>

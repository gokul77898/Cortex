<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORTEX · Legal Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --saffron: #FF9933;
  --green: #138808;
  --navy: #08081A;
  --glass: rgba(255,255,255,0.04);
  --glass-border: rgba(255,255,255,0.07);
  --text: #E8E8F0;
  --text-dim: rgba(232,232,240,0.35);
  --text-muted: rgba(232,232,240,0.18);
  --red: #FF4466; --yellow: #FFB800; --green-flag: #00E676; --blue: #4488FF;
  --radius: 12px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--navy); color:var(--text); overflow:hidden; }
body { background: radial-gradient(ellipse at 70% 20%, rgba(0,0,0,0.4), transparent 60%), radial-gradient(ellipse at 30% 80%, rgba(19,136,8,0.02), transparent 60%), var(--navy); }
#app { display:flex; flex-direction:column; height:100vh; }

header { display:flex; align-items:center; padding:10px 20px; background:rgba(8,8,26,0.6); backdrop-filter:blur(16px); border-bottom:1px solid var(--glass-border); gap:10px; flex-shrink:0; }
.back-link { color:var(--text-dim); text-decoration:none; font-size:13px; padding:4px 8px; border-radius:6px; transition:all 0.2s; }
.back-link:hover { color:var(--text); background:var(--glass); }
header h1 { font-size:16px; font-weight:700; background:linear-gradient(135deg,var(--green),var(--saffron)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
header .sub { font-size:11px; color:var(--text-dim); margin-left:auto; }

.chat-area { flex:1; overflow-y:auto; padding:20px 24px; display:flex; flex-direction:column; gap:10px; }
.chat-area:empty::after { content:'Ask me to explain any Indian law topic. I will teach you verbally like a tutor.'; display:block; text-align:center; color:var(--text-muted); margin-top:80px; font-size:13px; max-width:400px; margin-left:auto; margin-right:auto; line-height:1.6; }

.user-msg { max-width:80%; padding:10px 14px; line-height:1.6; font-size:13px; align-self:flex-end; background:linear-gradient(135deg,rgba(19,136,8,0.06),rgba(255,153,51,0.03)); border-radius:var(--radius) var(--radius) 4px var(--radius); animation:msgIn 0.3s ease; }
@keyframes msgIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

.speech-bar { display:none; align-items:center; justify-content:center; gap:10px; padding:16px 24px; flex-shrink:0; border-top:1px solid var(--glass-border); background:rgba(8,8,26,0.4); }
.speech-bar.visible { display:flex; }
.speech-dot { width:10px;height:10px;border-radius:50%;animation:dotPulse 1.2s ease-in-out infinite; }
.speech-dot.listening { background:var(--green-flag); }
.speech-dot.speaking { background:var(--saffron); }
.speech-dot.thinking { background:var(--yellow); }
@keyframes dotPulse { 0%,100%{opacity:0.3;transform:scale(0.8)} 50%{opacity:1;transform:scale(1.3)} }
.speech-label { font-size:12px; color:var(--text-dim); }
.speech-transcript { font-size:12px; color:var(--text); max-width:50%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.input-area { padding:10px 20px 14px; border-top:1px solid var(--glass-border); background:rgba(8,8,26,0.3); backdrop-filter:blur(8px); flex-shrink:0; }
.input-row { display:flex; gap:8px; align-items:flex-end; }
.input-wrapper { flex:1; }
.input-wrapper textarea { width:100%; padding:10px 14px; background:rgba(0,0,0,0.15); border:1px solid var(--glass-border); border-radius:10px; color:var(--text); font-size:13px; font-family:inherit; resize:none; min-height:38px; max-height:80px; outline:none; transition:border 0.2s; }
.input-wrapper textarea:focus { border-color:rgba(19,136,8,0.25); }
.input-wrapper textarea::placeholder { color:var(--text-muted); }
.mic-btn { width:38px;height:38px; border:1px solid var(--glass-border); border-radius:50%; background:transparent; color:var(--text-dim); font-size:16px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all 0.3s; }
.mic-btn:hover { background:var(--glass); color:var(--text); }
.mic-btn.active { border-color:var(--green-flag); color:var(--green-flag); background:rgba(0,230,118,0.06); animation:micPulse 1.4s ease-in-out infinite; }
@keyframes micPulse { 0%,100%{box-shadow:0 0 0 0 rgba(0,230,118,0.1)} 50%{box-shadow:0 0 0 6px rgba(0,230,118,0.04)} }
.send-btn { padding:8px 16px; background:linear-gradient(135deg,var(--green),var(--saffron)); border:none; border-radius:8px; color:white; font-size:12px; font-weight:600; cursor:pointer; height:38px; font-family:inherit; white-space:nowrap; }
.send-btn:disabled { opacity:0.2; cursor:not-allowed; }

.name-overlay { position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center; background:rgba(8,8,26,0.92); backdrop-filter:blur(32px); }
.name-card { background:var(--glass); backdrop-filter:blur(40px); border:1px solid var(--glass-border); border-radius:20px; padding:36px; max-width:400px; width:90%; text-align:center; }
.name-card h2 { font-size:22px; font-weight:700; margin-bottom:8px; background:linear-gradient(135deg,var(--green),var(--saffron)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.name-card p { color:var(--text-dim); font-size:13px; line-height:1.5; margin-bottom:20px; }
.name-card input { width:100%; padding:12px 16px; background:rgba(0,0,0,0.2); border:1px solid var(--glass-border); border-radius:10px; color:var(--text); font-size:14px; font-family:inherit; outline:none; text-align:center; transition:border 0.2s; }
.name-card input:focus { border-color:rgba(19,136,8,0.3); }
.name-card input::placeholder { color:var(--text-muted); }
.name-card .start-btn { display:inline-block; margin-top:16px; padding:10px 28px; background:linear-gradient(135deg,var(--green),var(--saffron)); border:none; border-radius:8px; color:white; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; transition:opacity 0.2s; }
.name-card .start-btn:disabled { opacity:0.3; cursor:not-allowed; }

::-webkit-scrollbar { width:3px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--glass-border); border-radius:2px; }

@media (max-width:720px) { .user-msg{max-width:92%} .speech-transcript{max-width:60%} }
</style>
</head>
<body>
<div id="app">
  <header>
    <a href="/" class="back-link">← Back</a>
    <h1>📚 Legal Learning</h1>
    <span class="sub">Speech‑only tutoring</span>
  </header>

  <div class="name-overlay" id="name-overlay">
    <div class="name-card">
      <h2>📚 Legal Learning</h2>
      <p>Before we begin — what's your name?</p>
      <input type="text" id="name-input" placeholder="Your name..." maxlength="40" autocomplete="off">
      <br>
      <button class="start-btn" id="start-btn" disabled>Start Learning</button>
    </div>
  </div>

  <div class="chat-area" id="chat-area"></div>

  <div class="speech-bar" id="speech-bar">
    <span class="speech-dot" id="speech-dot"></span>
    <span class="speech-label" id="speech-label">Ready</span>
    <span class="speech-transcript" id="speech-transcript"></span>
  </div>

  <div class="input-area">
    <div class="input-row">
      <button class="mic-btn" id="mic-btn" title="Toggle microphone">🎤</button>
      <div class="input-wrapper">
        <textarea id="msg-input" placeholder="Ask me to explain any law, or press 🎤 to speak..." rows="1"></textarea>
      </div>
      <button class="send-btn" id="send-btn">Send</button>
    </div>
  </div>
</div>

<script>
const MODE = 'learn';
const PORT = __PORT__;
const HAS_KEY = __HAS_KEY__;

if (!HAS_KEY) { document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#08081A;color:#888;font-size:14px">🔑 No API key. Run /connect in CORTEX terminal first.</div>'; }

let isLoading = false;
let micActive = false;
let speechRecognition = null;
let isListening = false;
let isSpeaking = false;
let isProcessing = false;
let silenceTimer = null;
let accumulatedText = '';
let conversationHistory = [];
let userName = localStorage.getItem('legalUserName') || '';

const $ = (id) => document.getElementById(id);
const chatArea = $('chat-area');
const msgInput = $('msg-input');
const sendBtn = $('send-btn');
const micBtn = $('mic-btn');
const speechBar = $('speech-bar');
const speechDot = $('speech-dot');
const speechLabel = $('speech-label');
const speechTranscript = $('speech-transcript');
const nameOverlay = $('name-overlay');
const nameInput = $('name-input');
const startBtn = $('start-btn');

// ── Name prompt ──
if (!userName) {
  nameOverlay.style.display = 'flex';
  nameInput.addEventListener('input', () => {
    startBtn.disabled = !nameInput.value.trim();
  });
  nameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && nameInput.value.trim()) startBtn.click();
  });
  startBtn.addEventListener('click', () => {
    userName = nameInput.value.trim();
    if (!userName) return;
    localStorage.setItem('legalUserName', userName);
    nameOverlay.style.display = 'none';
    begin();
  });
} else {
  nameOverlay.style.display = 'none';
  begin();
}

// ── Voices ──
let selectedVoice = null;
const synth = window.speechSynthesis;
synth.onvoiceschanged = () => {
  const v = synth.getVoices();
  selectedVoice = v.find(v => v.lang.startsWith('en-GB') && v.name.includes('Female'))
    || v.find(v => v.lang.startsWith('en-IN'))
    || v.find(v => v.lang.startsWith('en-GB'))
    || v.find(v => v.lang.startsWith('en-US'))
    || v[0];
};
setTimeout(() => { const v = synth.getVoices(); if (v.length) synth.onvoiceschanged(); }, 100);

// ── Speech Recognition ──
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

function initSpeechRec() {
  if (!SpeechRec) { setStatus('error', 'Speech not supported. Use Chrome.'); return; }
  speechRecognition = new SpeechRec();
  speechRecognition.continuous = true;
  speechRecognition.interimResults = true;
  speechRecognition.lang = 'en-IN';

  speechRecognition.onresult = (e) => {
    let final = '';
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript + ' ';
      else interim += e.results[i][0].transcript;
    }
    if (final) {
      accumulatedText += final;
      clearTimeout(silenceTimer);
      silenceTimer = setTimeout(() => {
        if (accumulatedText.trim()) {
          const t = accumulatedText.trim();
          accumulatedText = '';
          handleInput(t);
        }
      }, 1500);
    }
    const display = (accumulatedText + interim).trim();
    if (display) { setStatus('listening', 'Listening...', display); }
  };

  speechRecognition.onerror = (e) => {
    if (e.error === 'no-speech') return;
    setStatus('error', 'Mic error. Tap 🎤 to retry.', '');
    micActive = false;
    micBtn.classList.remove('active');
  };

  speechRecognition.onend = () => {
    isListening = false;
    if (micActive && !isProcessing && !isSpeaking) {
      try { speechRecognition.start(); isListening = true; } catch {}
    }
  };
}

function startMic() {
  if (!SpeechRec) { setStatus('error', 'Speech not supported. Use Chrome.'); return; }
  if (!speechRecognition) initSpeechRec();
  if (!speechRecognition) return;
  if (isListening) return;
  try {
    speechRecognition.start();
    isListening = true;
    micActive = true;
    micBtn.classList.add('active');
    accumulatedText = '';
    setStatus('listening', 'Listening...', '');
  } catch {}
}

function stopMic() {
  if (!isListening) return;
  try { speechRecognition.stop(); } catch {}
  isListening = false;
  micActive = false;
  micBtn.classList.remove('active');
  clearTimeout(silenceTimer);
  if (accumulatedText.trim()) {
    const t = accumulatedText.trim();
    accumulatedText = '';
    handleInput(t);
  }
}

// ── Speech Synthesis ──
function speakText(text) {
  return new Promise((resolve) => {
    if (!text || !synth) { resolve(); return; }
    synth.cancel();
    const clean = text.replace(/[#*_\[\]\(\)<>]/g, '').replace(/\s+/g, ' ').trim();
    if (!clean) { resolve(); return; }
    const utter = new SpeechSynthesisUtterance(clean);
    if (selectedVoice) utter.voice = selectedVoice;
    utter.rate = 0.92;
    utter.pitch = 1.0;
    isSpeaking = true;
    setStatus('speaking', 'Speaking...', '');
    utter.onend = () => { isSpeaking = false; resolve(); };
    utter.onerror = () => { isSpeaking = false; resolve(); };
    synth.speak(utter);
  });
}

// ── Status ──
function setStatus(state, label, transcript) {
  speechBar.classList.add('visible');
  speechDot.className = 'speech-dot ' + state;
  speechLabel.textContent = label;
  speechTranscript.textContent = transcript || '';
}
function hideStatus() { speechBar.classList.remove('visible'); }

// ── Handle Input ──
async function handleInput(text) {
  if (isLoading || isProcessing) return;
  isProcessing = true;
  isLoading = true;
  sendBtn.disabled = true;

  addUserMsg(text);
  conversationHistory.push({ role: 'user', content: text });
  setStatus('thinking', 'Thinking...', '');

  try {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: conversationHistory, mode: MODE, userName }),
    });
    const d = await r.json();
    if (!r.ok) {
      setStatus('error', `Error: ${d.error?.message || 'HTTP ' + r.status}`, '');
    } else {
      const reply = d.choices?.[0]?.message?.content;
      if (reply) {
        conversationHistory.push({ role: 'assistant', content: reply });
        await speakText(reply);
      } else {
        setStatus('error', 'No response from model', '');
      }
    }
  } catch (e) {
    setStatus('error', `Error: ${e.message}`, '');
  }

  isProcessing = false;
  isLoading = false;
  sendBtn.disabled = false;

  if (micActive) {
    setStatus('listening', 'Listening...', '');
    if (!isListening) {
      try { speechRecognition.start(); isListening = true; } catch {}
    }
  } else {
    hideStatus();
    msgInput.focus();
  }
}

function addUserMsg(text) {
  const div = document.createElement('div');
  div.className = 'user-msg';
  div.textContent = text;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

// ── Events ──
micBtn.addEventListener('click', () => {
  if (isSpeaking) { synth.cancel(); isSpeaking = false; return; }
  if (micActive) { stopMic(); hideStatus(); }
  else { startMic(); }
});

sendBtn.addEventListener('click', () => {
  const text = msgInput.value.trim();
  if (!text || isLoading) return;
  msgInput.value = ''; msgInput.style.height = 'auto';
  if (isSpeaking) synth.cancel();
  handleInput(text);
});

msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); }
});
msgInput.addEventListener('input', () => {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 80) + 'px';
});

function begin() {
  setTimeout(() => { const v = synth.getVoices(); if (v.length) synth.onvoiceschanged(); }, 100);
  setStatus('listening', `Welcome${userName ? ', ' + userName : ''}! Ask me anything about Indian law.`, '');
  sendBtn.textContent = 'Send';
  msgInput.focus();
}
</script>
</body>
</html>

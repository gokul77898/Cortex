<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CORTEX JARVIS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0d0d12;
      color: #e4e4e7;
      height: 100vh;
      display: grid;
      grid-template-columns: 1fr 280px;
      grid-template-rows: 50px 1fr 60px;
    }
    .header {
      grid-column: 1/-1;
      background: #18181f;
      border-bottom: 1px solid #27272a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .logo { font-size: 16px; font-weight: 600; background: linear-gradient(90deg, #00f0ff, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .status { font-size: 12px; color: #71717a; }
    .status.ready { color: #22c55e; }
    .status.running { color: #f97316; }
    .chat {
      grid-column: 1;
      grid-row: 2;
      padding: 16px;
      overflow-y: auto;
      border-right: 1px solid #27272a;
    }
    .msg {
      margin-bottom: 12px;
      max-width: 85%;
    }
    .msg.user { margin-left: auto; }
    .msg-content {
      background: #1f1f2e;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .msg.user .msg-content {
      background: #1a1a28;
      border: 1px solid #00f0ff;
    }
    .term {
      grid-column: 2;
      grid-row: 2/4;
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
    }
    .term-header {
      padding: 10px 12px;
      font-size: 11px;
      color: #71717a;
      border-bottom: 1px solid #27272a;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .term-content {
      flex: 1;
      padding: 8px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 10px;
      overflow-y: auto;
      color: #a1a1aa;
    }
    .input {
      grid-column: 1;
      grid-row: 3;
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      background: #18181f;
      border-top: 1px solid #27272a;
    }
    #input {
      flex: 1;
      background: #12121a;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 10px 14px;
      color: #e4e4e7;
      font-size: 14px;
      outline: none;
    }
    #input:focus { border-color: #00f0ff; box-shadow: 0 0 0 2px rgba(0,240,255,0.1); }
    .btn {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
    }
    .send { background: linear-gradient(135deg, #00f0ff, #00c0cc); color: #000; }
    .send:hover { box-shadow: 0 0 15px rgba(0,240,255,0.4); }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">🤖 CORTEX JARVIS</div>
    <div class="status ready" id="status">Ready</div>
  </header>

  <div class="chat" id="chat">
    <div class="msg">
      <div class="msg-content">👋 Hello! I'm your AI assistant. Type a message or command below.</div>
    </div>
  </div>

  <div class="term">
    <div class="term-header">⚡ Activity</div>
    <div class="term-content" id="term"></div>
  </div>

  <div class="input">
    <input type="text" id="input" placeholder="Ask me anything..." autofocus>
    <button class="btn send" id="send">➤</button>
  </div>

  <script>
    const input = document.getElementById('input')
    const sendBtn = document.getElementById('send')
    const chat = document.getElementById('chat')
    const term = document.getElementById('term')
    const status = document.getElementById('status')

    // Activity = ALL CLI logs (preflight, QR, session, debug)
    function logActivity(text, color) {
      const div = document.createElement('div')
      div.style.color = color || '#a1a1aa'
      div.textContent = text.slice(0, 500)
      term.appendChild(div)
      term.scrollTop = term.scrollHeight
    }

    // Chat = ONLY clean AI response
    function addMsg(text, isUser = false) {
      const div = document.createElement('div')
      div.className = 'msg ' + (isUser ? 'user' : 'ai')
      div.innerHTML = `<div class="msg-content">${text.replace(/</g, '&lt;')}</div>`
      chat.appendChild(div)
      chat.scrollTop = chat.scrollHeight
    }

    async function run() {
      const cmd = input.value.trim()
      if (!cmd) return
      
      input.value = ''
      addMsg(cmd, true)
      logActivity('❯ ' + cmd, '#00f0ff')
      status.textContent = 'Running...'
      status.className = 'status running'

      try {
        // Just trigger - response comes via 'response' event
        await window.jarvis.runCommand(cmd)
        // Don't add output here - wait for 'response' event
        status.textContent = 'Ready'
        status.className = 'status ready'
      } catch (e) {
        logActivity('Error: ' + e.message, '#ef4444')
        status.textContent = 'Error'
      }
    }

    // Handle separate channels
    if (window.jarvis) {
      // activity = ALL CLI logs → goes to terminal/activity panel
      window.jarvis.onActivity(data => {
        logActivity(data.slice(0, 500), '#22c55e')
      })
      
      // response = ONLY clean AI response → goes to chat
      window.jarvis.onResponse(data => {
        addMsg(data.slice(0, 2000) || 'Command completed.')
      })
      
      window.jarvis.onClear(() => {
        chat.innerHTML = '<div class="msg"><div class="msg-content">👋 Hello! Type a message or command below.</div></div>'
        term.innerHTML = ''
      })
    }

    input.addEventListener('keydown', e => { if (e.key === 'Enter') run() })
    sendBtn.addEventListener('click', run)

    logActivity('JARVIS ready')
  </script>
</body>
</html>

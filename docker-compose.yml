# =============================================================================
# CORTEX CLI — Docker Compose (Production)
# =============================================================================
# Usage:
#   docker-compose up -d
#   docker-compose run cortex "hello world"
#   docker-compose down
# =============================================================================

services:
  cortex:
    build: .
    image: cortex:latest
    container_name: cortex
    stdin_open: true
    tty: true
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-minimax/minimax-m2.5:free}
      - CORTEX_SIMPLE=1
      - CORTEX_ALLOW_OPEN=0
      - HF_TOKEN=${HF_TOKEN}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    volumes:
      - ./workspace:/workspace
      - cortex-data:/home/cortex/.cortex
    working_dir: /workspace
    restart: unless-stopped

volumes:
  cortex-data:
